  <body>
    <main id="demo">
      <noscript>
        <h1>Databend</h1>
        <p>
          An FFGL effect that treats each frame the way an audio editor treats a
          raw file: one long stream of samples in the file's own layout, run
          through actual delay-line effects. An echo comes back lines down and
          samples across, and marches down on a slant with feedback. A flanger
          swept in stream time combs across the scanlines. A phaser smears
          smooth content to the right with ringing, at unity gain. A pitch
          shifter stretches the scan inside grains. In an interleaved file a
          delay lands one channel over and every effect rotates the hue, and
          past full scale an 8-bit file wraps round. None of it is drawn.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/databend">its repository</a>.
        </p>
